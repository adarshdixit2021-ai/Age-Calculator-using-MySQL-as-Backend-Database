<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Calculator & Analytics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Left Column: Main Calculator -->
        <div class="card calc-card">
            <div class="card-header">
                <h2>🎂 Age Calculator</h2>
            </div>

            <div class="form-group">
                <label for="userName">FULL NAME</label>
                <input type="text" id="userName" placeholder="e.g. Adarsh Dixit" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="dob">DATE OF BIRTH</label>
                <input type="date" id="dob">
            </div>

            <button id="calculateBtn" class="glow-btn">⚡ Calculate & Save</button>

            <p id="statusMsg" class="status-text"></p>

            <!-- Primary Age Output Grid -->
            <div class="primary-grid">
                <div class="stat-pill">
                    <h1 id="yearsVal">--</h1>
                    <span>YEARS</span>
                </div>
                <div class="stat-pill">
                    <h1 id="monthsVal">--</h1>
                    <span>MONTHS</span>
                </div>
                <div class="stat-pill">
                    <h1 id="daysVal">--</h1>
                    <span>DAYS</span>
                </div>
            </div>

            <!-- Detailed Analytics 2x2 Grid -->
            <div class="analytics-grid">
                <div class="analytics-tile">
                    <span class="tile-icon">🌙</span>
                    <span class="tile-label">ZODIAC SIGN</span>
                    <h3 id="zodiacVal">--</h3>
                </div>
                <div class="analytics-tile">
                    <span class="tile-icon">⌛</span>
                    <span class="tile-label">TOTAL DAYS LIVED</span>
                    <h3 id="totalDaysVal">--</h3>
                </div>
                <div class="analytics-tile">
                    <span class="tile-icon">🎂</span>
                    <span class="tile-label">NEXT BIRTHDAY</span>
                    <h3 id="nextBdayVal">--</h3>
                </div>
                <div class="analytics-tile">
                    <span class="tile-icon">📅</span>
                    <span class="tile-label">BIRTH YEAR TYPE</span>
                    <h3 id="yearTypeVal">--</h3>
                </div>
            </div>
        </div>

        <!-- Right Column: Sidebar (Records & Dev Card) -->
        <div class="sidebar">
            <!-- Records Box -->
            <div class="card records-card">
                <div class="section-title">
                    📋 Recent Saved Records
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>DOB</th>
                                <th>Zodiac</th>
                                <th>Days</th>
                            </tr>
                        </thead>
                        <tbody id="recordsTableBody">
                            <!-- Populated via script.js -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Developer Profile Box -->
            <div class="card dev-card">
                <div class="badge">⚡ CREATED BY DEVELOPER</div>
                <h2 class="dev-name">Adarsh Dixit</h2>

                <div class="info-row">
                    <span class="info-icon">📸</span>
                    <div>
                        <small>INSTAGRAM</small>
                        <p>@unique_world99.9</p>
                    </div>
                </div>

                <div class="info-row">
                    <span class="info-icon">📩</span>
                    <div>
                        <small>CONTACT DEVELOPER</small>
                        <p>adarshdixit2021@gmail.com</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
